<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FOCUS — Pomodoro Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@300;400;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="scanlines"></div>

  <main class="app" id="app">

    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-dot" id="statusDot" aria-hidden="true"></span>
        <span class="logo-text">FOCUS</span>
      </div>
      <div class="session-label" id="sessionLabel" aria-live="polite">READY</div>
    </header>

    <!-- Timer Ring -->
    <section class="timer-section" aria-label="Timer">
      <div class="ring-wrap" id="ringWrap">
        <svg class="ring-svg" viewBox="0 0 340 340" aria-hidden="true">
          <!-- tick marks -->
          <g class="ticks" id="tickMarks"></g>
          <!-- track -->
          <circle class="ring-track" cx="170" cy="170" r="148" />
          <!-- progress -->
          <circle class="ring-progress" id="ringProgress" cx="170" cy="170" r="148" />
          <!-- pulse ring -->
          <circle class="ring-pulse" id="ringPulse" cx="170" cy="170" r="148" />
        </svg>

        <div class="timer-face">
          <div class="timer-display" id="timerDisplay" role="timer" aria-label="Time remaining">25:00</div>
          <div class="timer-phase" id="timerPhase">FOCUS</div>
        </div>
      </div>
    </section>

    <!-- Controls -->
    <section class="controls" aria-label="Timer controls">
      <button class="btn btn-ghost" id="btnReset" aria-label="Reset timer" title="Reset">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
          <path d="M3 3v5h5"/>
        </svg>
        <span>RESET</span>
      </button>

      <button class="btn btn-primary" id="btnStart" aria-label="Start timer">
        <svg class="btn-icon-play" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <polygon points="5,3 19,12 5,21"/>
        </svg>
        <svg class="btn-icon-pause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none" aria-hidden="true">
          <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
        </svg>
        <span id="btnStartLabel">START</span>
      </button>

      <button class="btn btn-ghost" id="btnSettings" aria-label="Open settings" aria-expanded="false" aria-controls="settingsPanel" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
        <span>CONFIG</span>
      </button>
    </section>

    <!-- Settings Panel -->
    <aside class="settings-panel" id="settingsPanel" aria-label="Timer configuration" hidden>
      <div class="settings-grid">
        <label class="setting-field">
          <span class="setting-label">FOCUS <em>min</em></span>
          <div class="setting-input-wrap">
            <button class="stepper" data-target="focusInput" data-delta="-1" aria-label="Decrease focus time">−</button>
            <input type="number" id="focusInput" min="1" max="99" value="25" aria-label="Focus duration in minutes" />
            <button class="stepper" data-target="focusInput" data-delta="1" aria-label="Increase focus time">+</button>
          </div>
        </label>
        <label class="setting-field">
          <span class="setting-label">BREAK <em>min</em></span>
          <div class="setting-input-wrap">
            <button class="stepper" data-target="breakInput" data-delta="-1" aria-label="Decrease break time">−</button>
            <input type="number" id="breakInput" min="1" max="99" value="5" aria-label="Break duration in minutes" />
            <button class="stepper" data-target="breakInput" data-delta="1" aria-label="Increase break time">+</button>
          </div>
        </label>
      </div>
      <button class="btn btn-apply" id="btnApply">APPLY</button>
    </aside>

    <!-- Completion Flash -->
    <div class="completion-flash" id="completionFlash" aria-hidden="true"></div>

    <!-- History -->
    <section class="history-section" aria-label="Today's completed sessions">
      <div class="history-header">
        <span class="history-title">TODAY</span>
        <span class="history-count" id="historyCount">0 sessions</span>
      </div>
      <ul class="history-list" id="historyList" aria-label="Completed focus sessions">
        <li class="history-empty" id="historyEmpty">No sessions yet — start focusing.</li>
      </ul>
    </section>

  </main>

  <!-- Completion overlay -->
  <div class="done-overlay" id="doneOverlay" role="dialog" aria-modal="true" aria-label="Session complete" hidden>
    <div class="done-card">
      <div class="done-icon" aria-hidden="true">✓</div>
      <div class="done-title" id="doneTitle">FOCUS COMPLETE</div>
      <div class="done-sub" id="doneSub">BREAK TIME STARTING</div>
    </div>
  </div>

  <script src="src/app.js"></script>
</body>
</html>
<!-- a11y: aria-live, role=timer, focus states -->
